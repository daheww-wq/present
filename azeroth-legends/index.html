<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아제로스 레전드 - 브라우저 RPG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 캐릭터 생성 -->
<section id="screen-create" class="screen open">
  <h1>⚔️ 아제로스 레전드</h1>
  <p class="muted">다섯 지역, 다섯 우두머리, 여섯 직업. 당신의 전설을 시작하세요.</p>
  <button id="btn-load" class="primary" style="display:none;margin-bottom:16px"></button>
  <div class="create-preview"><canvas id="create-preview" width="140" height="170"></canvas><div class="muted small">종족과 직업에 따라 외형이 바뀌고,<br>장비를 입히면 캐릭터에 그대로 나타납니다.</div></div>
  <h4>이름</h4>
  <input id="inp-name" maxlength="12" placeholder="캐릭터 이름을 입력하세요">
  <h4>종족</h4>
  <div id="race-list" class="cards"></div>
  <h4>직업</h4>
  <div id="class-list" class="cards"></div>
  <div class="create-actions"><button id="btn-create" class="primary">🎮 모험 시작</button></div>
</section>

<!-- 게임 -->
<section id="screen-game" class="screen">
  <div class="topbar"><div id="hud-name"></div><div id="hud-zone"></div><div id="hud-gold"></div></div>
  <div class="bars">
    <div id="bar-hp" class="bar"><div class="fill"></div><div class="txt"></div></div>
    <div id="bar-res" class="bar"><div class="fill"></div><div class="txt"></div></div>
    <div id="bar-xp" class="bar"><div class="fill"></div><div class="txt"></div></div>
  </div>
  <div class="layout">
    <canvas id="canvas" width="768" height="512"></canvas>
    <div class="right">
      <div class="tabs">
        <button class="tab-btn active" data-tab="char">캐릭터</button>
        <button class="tab-btn" data-tab="bag">가방</button>
        <button class="tab-btn" data-tab="quest">퀘스트</button>
        <button class="tab-btn" data-tab="skill">기술</button>
        <button class="tab-btn" data-tab="talent" id="tab-btn-talent">특성</button>
        <button class="tab-btn" data-tab="companion">💬 동료</button>
      </div>
      <div id="panel"></div>
      <div id="companion-panel" style="display:none">
        <div id="co-head"></div>
        <div id="co-msgs"></div>
        <div class="co-row"><input id="co-input" maxlength="300" placeholder="예: 선공해 / 힐 / 따라와 / 보스 어디야? (T키)"><button id="co-send">보내기</button><button id="co-stop" style="display:none">중단</button></div>
      </div>
    </div>
  </div>
  <div id="actionbar"></div>
  <div class="bottom">
    <div>
      <div id="log"></div>
      <div class="help">⌨️ 이동: WASD/방향키 · 공격: Space · 기술: 1~6 · 물약: Q · NPC 대화: E · 동료 대화: T · 탭: C 캐릭터, I 가방, L 퀘스트, K 기술, N 특성</div>
    </div>
    <div class="mobile">
      <div class="dpad">
        <button class="e"></button><button data-key="ArrowUp">▲</button><button class="e"></button>
        <button data-key="ArrowLeft">◀</button><button class="e"></button><button data-key="ArrowRight">▶</button>
        <button class="e"></button><button data-key="ArrowDown">▼</button><button class="e"></button>
      </div>
      <button id="btn-attack" class="atkbtn">⚔️</button>
    </div>
  </div>
</section>

<!-- 대화 모달 -->
<div id="dialog" class="modal"><div class="box"><h3 id="dialog-title"></h3><div id="dialog-body"></div><div id="dialog-buttons"></div></div></div>

<script src="js/data.js"></script>
<script src="js/sprite.js"></script>
<script src="js/companion.js"></script>
<script src="js/game.js"></script>
</body>
</html>
